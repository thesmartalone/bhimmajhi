<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bhim Majhi · Admin Upload</title>

  <link rel="stylesheet" href="admin.css?v=2">

  <!-- Cloudinary Upload Widget -->
  <script
    src="https://upload-widget.cloudinary.com/global/all.js"
    type="text/javascript">
  </script>
</head>

<body>

  <main class="admin-card">

    <div class="brand">
      Smart<span>Alone</span>
    </div>

    <h1>Photo / Video Upload</h1>

    <p class="muted">
      Photo ya video upload karke post publish karo.
    </p>


    <!-- LOGIN -->

    <section id="loginBox">

      <input
        id="email"
        type="email"
        placeholder="Admin email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
      >

      <button id="loginBtn">
        Login
      </button>

      <p id="loginMsg" class="msg"></p>

    </section>


    <!-- UPLOAD -->

    <section id="uploadBox" hidden>

      <div class="logged">
        Logged in:
        <span id="userEmail"></span>
      </div>


      <input
        id="title"
        type="text"
        maxlength="80"
        placeholder="Title (e.g. Rooftop View)"
      >


      <input
        id="tag"
        type="text"
        maxlength="30"
        placeholder="Tag (e.g. #sunset)"
      >

      <!-- Photo-wise SEO (design/layout unchanged) -->
      <input
        id="seoTitle"
        type="text"
        maxlength="120"
        placeholder="SEO Title (photo ka search title)"
      >

      <input
        id="seoAlt"
        type="text"
        maxlength="160"
        placeholder="SEO ALT (photo ka exact description)"
      >

      <input
        id="seoKeywords"
        type="text"
        maxlength="300"
        placeholder="SEO Keywords (comma se alag)"
      >

      <textarea
        id="seoDescription"
        maxlength="320"
        placeholder="SEO Description (photo ke baare mein)"
      ></textarea>


      <!-- Cloudinary upload button -->

      <button id="uploadBtn">
        📤 Photo / Video Upload
      </button>


      <button
        id="logoutBtn"
        class="secondary">
        Logout
      </button>


      <!-- Progress -->

      <div class="progress-wrap">
        <div id="progressBar"></div>
      </div>


      <p
        id="progressPercent"
        class="progress-percent">
        0%
      </p>


      <p
        id="status"
        class="msg">
      </p>


      <a
        class="back"
        href="index.html">
        ← Website dekho
      </a>

    </section>


    <!-- POSTS LIST -->

    <section id="postsBox" hidden>

      <h2 class="posts-title">
        📋 Posts
      </h2>

      <div id="postsList" class="posts-list">
        <!-- posts render here -->
      </div>

    </section>

  </main>


  <!-- Main JavaScript -->

  <script
    type="module"
    src="admin.js?v=3">
  </script>

</body>
</html>
